<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" width="300" height="320">
  <defs>
    <linearGradient id="capT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a5db8"/><stop offset="1" stop-color="#0a2a66"/></linearGradient>
    <linearGradient id="capB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#143f8f"/><stop offset="1" stop-color="#08224f"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd24a"/><stop offset="1" stop-color="#f0a800"/></linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2b6fb5"/><stop offset="1" stop-color="#4f9ad8"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3fb6c9"/><stop offset="1" stop-color="#7ad3de"/></linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1d4f9c"/><stop offset="1" stop-color="#3a78c8"/></linearGradient>
    <linearGradient id="b4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5ab0e6"/><stop offset="1" stop-color="#9bd2f3"/></linearGradient>
    <radialGradient id="sh"><stop offset="0" stop-color="#1b4a86" stop-opacity=".28"/><stop offset="1" stop-color="#1b4a86" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- yellow swoosh -->
  <path d="M0 262c40 22 110 38 190 34" fill="none" stroke="#ffc83a" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="160" cy="298" rx="150" ry="14" fill="url(#sh)"/>
  <!-- pencil cup -->
  <g>
    <rect x="22" y="118" width="7" height="60" rx="2" fill="#ffc83a" transform="rotate(-12 25 178)"/>
    <rect x="34" y="112" width="7" height="66" rx="2" fill="#3fb6c9" transform="rotate(-4 37 178)"/>
    <rect x="46" y="116" width="7" height="62" rx="2" fill="#ef6f6c" transform="rotate(7 49 178)"/>
    <path d="M18 168h42l-4 40a6 6 0 0 1-6 5H28a6 6 0 0 1-6-5z" fill="#cfe6f7"/>
    <path d="M18 168h42l-1 10H19z" fill="#e7f3fc"/>
  </g>
  <!-- book stack (bottom to top) -->
  <g>
    <!-- book 1 -->
    <rect x="40" y="248" width="220" height="38" rx="6" fill="url(#b1)"/>
    <rect x="52" y="256" width="204" height="22" rx="3" fill="#f6fbff"/>
    <path d="M52 262h204M52 268h204M52 273h204" stroke="#cfe0ee" stroke-width="1.2"/>
    <rect x="40" y="248" width="14" height="38" rx="5" fill="#1d5aa0"/>
    <!-- book 2 -->
    <rect x="52" y="214" width="204" height="36" rx="6" fill="url(#b2)"/>
    <rect x="64" y="222" width="190" height="20" rx="3" fill="#f6fbff"/>
    <path d="M64 228h190M64 234h190" stroke="#cfe0ee" stroke-width="1.2"/>
    <rect x="52" y="214" width="14" height="36" rx="5" fill="#2a9db3"/>
    <!-- book 3 -->
    <rect x="44" y="180" width="206" height="36" rx="6" fill="url(#b3)"/>
    <rect x="56" y="188" width="192" height="20" rx="3" fill="#f6fbff"/>
    <path d="M56 194h192M56 200h192" stroke="#cfe0ee" stroke-width="1.2"/>
    <rect x="44" y="180" width="14" height="36" rx="5" fill="#153f80"/>
    <rect x="150" y="190" width="40" height="6" rx="3" fill="#ffc83a" opacity=".9"/>
    <!-- book 4 -->
    <rect x="56" y="148" width="190" height="34" rx="6" fill="url(#b4)"/>
    <rect x="68" y="156" width="176" height="18" rx="3" fill="#f6fbff"/>
    <path d="M68 162h176M68 168h176" stroke="#cfe0ee" stroke-width="1.2"/>
    <rect x="56" y="148" width="14" height="34" rx="5" fill="#3f93cf"/>
  </g>
  <!-- graduation cap on top -->
  <g transform="rotate(-6 150 120)">
    <path d="M86 112v26c0 14 28 22 64 22s64-8 64-22v-26l-64 20z" fill="url(#capB)"/>
    <polygon points="150,60 262,100 150,142 38,100" fill="url(#capT)"/>
    <polygon points="150,60 262,100 150,142 38,100" fill="none" stroke="#5f8fd8" stroke-width="1.5" stroke-linejoin="round" opacity=".55"/>
    <path d="M150 100L246 108v46" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="150" cy="100" r="6" fill="url(#gold)"/>
    <path d="M240 152h13l4 26h-21z" fill="url(#gold)"/>
    <rect x="240" y="148" width="13" height="7" rx="3" fill="#f0a800"/>
